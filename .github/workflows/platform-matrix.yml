name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  podman:
    name: Rootless Podman / small lifecycle
    # 24.04 provides Podman 4.9; 26.04 provides the supported 5.7 package and matching helpers.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SPACEAPP_TELEMETRY: "0"
      # Test the source launcher against published images; the 1.1.8 source candidate is not published yet.
      SPACEAPP_CI_RUNTIME_VERSION: "1.1.7"
      SPACEAPP_CI_PODMAN_PACKAGE: "5.7.0+ds2-3build1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
      - name: Prepare rootless Podman and Docker Compose v2 provider
        run: |
          echo "SPACEAPP_HOME=$RUNNER_TEMP/spaceapp-podman" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades "podman=$SPACEAPP_CI_PODMAN_PACKAGE" uidmap slirp4netns
          test "$(dpkg-query -W -f='${Version}' podman)" = "$SPACEAPP_CI_PODMAN_PACKAGE"
          # This disposable runner's pasta helper cannot receive Podman's stop signal.
          # Select the supported slirp4netns helper; keep AppArmor and network isolation enabled.
          config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/containers/containers.conf.d"
          mkdir -p "$config_dir"
          printf '[network]\ndefault_rootless_network_cmd="slirp4netns"\n' > "$config_dir/99-spaceapp-ci.conf"
          # Docker Compose's plugin binary also works as Podman's external docker-compose provider.
          compose=''
          for directory in /usr/libexec/docker/cli-plugins /usr/lib/docker/cli-plugins; do
            if test -f "$directory/docker-compose"; then compose="$directory/docker-compose"; break; fi
          done
          test -n "$compose"
          mkdir -p "$RUNNER_TEMP/podman-bin"
          ln -s "$compose" "$RUNNER_TEMP/podman-bin/docker-compose"
          ln -s /usr/bin/podman "$RUNNER_TEMP/podman-bin/podman"
          echo "$RUNNER_TEMP/podman-bin" >> "$GITHUB_PATH"
          # Use the distribution's normal user service, including its health-check timer environment.
          /usr/bin/systemctl --user start podman.socket
          for attempt in {1..20}; do test -S "$XDG_RUNTIME_DIR/podman/podman.sock" && break; sleep 1; done
          test -S "$XDG_RUNTIME_DIR/podman/podman.sock"
          /usr/bin/podman version
          /usr/bin/podman info --format json
      - name: Install, verify readiness, back up, and remove small profile
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/podman-bin:$PATH"
          launcher=packages/run-spaceapp/tests/podman-ci.mjs
          answers='{"confirm":true,"profile":"small","access":"isolated","companions":false,"telemetry":false,"open":false,"purgeConfirm":"DELETE"}'
          # Stream readiness diagnostics while redacting the ephemeral owner setup token.
          # pipefail preserves the install's failure status through the redactor.
          timeout --signal=TERM --kill-after=10s 15m node "$launcher" install --engine podman --profile small --non-interactive --answers "$answers" 2>&1 | sed -u -E 's/(token:|token is:).*/\1 [redacted]/I'
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:4911/readyz | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{if(JSON.parse(s).ok!==true)process.exit(1)})'
          node "$launcher" doctor
          node "$launcher" status
          node "$launcher" backup
          # A successful backup must actually resume writers before uninstall, not just return zero.
          curl --fail --max-time 10 http://127.0.0.1:4911/readyz | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{if(JSON.parse(s).ok!==true)process.exit(1)})'
          node "$launcher" uninstall --purge-data --non-interactive --answers "$answers"
      - name: Always clean up and assert that no project containers or volumes remain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/podman-bin:$PATH"
          cleanup_status=0
          project=$(node --input-type=module -e 'import {composeProjectName} from "./packages/run-spaceapp/src/index.mjs"; console.log(composeProjectName(process.env.SPACEAPP_HOME))')
          # Only status/health fields and the disposable database's logs: never dump config, env or secrets.
          podman ps -a --filter "label=com.docker.compose.project=$project" --format '{{.Names}} {{.Status}}' || true
          containers=$(podman ps -aq --filter "label=com.docker.compose.project=$project")
          if test -n "$containers"; then
            while read -r container; do
              timeout 15s podman inspect --format '{{.Name}} {{json .State.Health}}' "$container" || true
            done <<< "$containers"
          fi
          timeout 15s podman logs --tail 80 "$project-postgres-1" 2>&1 | sed -E 's/(token:|token is:).*/\1 [redacted]/I' || true
          if test -f "$SPACEAPP_HOME/config.json"; then
            node packages/run-spaceapp/tests/podman-ci.mjs uninstall --purge-data --non-interactive --answers '{"purgeConfirm":"DELETE"}' || cleanup_status=$?
          fi
          # A failed fresh install has no committed config. Remove only this disposable fixture's labelled objects.
          containers=$(podman ps -aq --filter "label=com.docker.compose.project=$project")
          if test -n "$containers"; then mapfile -t targets <<< "$containers"; podman rm --force -- "${targets[@]}"; fi
          volumes=$(podman volume ls -q --filter "label=com.docker.compose.project=$project")
          if test -n "$volumes"; then mapfile -t targets <<< "$volumes"; podman volume rm -- "${targets[@]}"; fi
          networks=$(podman network ls -q --filter "label=com.docker.compose.project=$project")
          if test -n "$networks"; then mapfile -t targets <<< "$networks"; podman network rm -- "${targets[@]}"; fi
          containers=$(podman ps -aq --filter "label=com.docker.compose.project=$project")
          volumes=$(podman volume ls -q --filter "label=com.docker.compose.project=$project")
          networks=$(podman network ls -q --filter "label=com.docker.compose.project=$project")
          test -z "$containers"
          test -z "$volumes"
          test -z "$networks"
          exit "$cleanup_status"
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version
